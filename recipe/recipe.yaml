schema_version: 1

context:
  name: pytradfri
  version: "14.0.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pytradfri-${{ version }}.tar.gz
  sha256: 05dca2680b6b47e559c8ab321db595805769ffa6b7170a8d1a3bdf1d3442714f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - pydantic

tests:
  - python:
      imports:
        - pytradfri
        - pytradfri.api
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: IKEA Trådfri/Tradfri API. Control and observe your lights from Python.
  description: |
    Python package to communicate with the IKEA Trådfri (Tradfri)
    ZigBee Gateway compatible with ZigBee Light Link products. By
    using this library you can communicate with the gateway and
    control IKEA's lights and wall plugs.
  homepage: https://github.com/home-assistant-libs/pytradfri
  repository: https://github.com/home-assistant-libs/pytradfri
  documentation: https://github.com/home-assistant-libs/pytradfri

extra:
  recipe-maintainers:
    - jan-janssen
